<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRadius Dental Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --teal: #00A499;
            --teal-dark: #007A70;
            --teal-light: #E0F5F4;
            --green: #4CAF87;
            --green-light: #E8F5EE;
            --white: #ffffff;
            --bg: #F0F9F8;
            --text: #1A1A1A;
            --text-muted: #888;
            --border: #E0EDEC;
            --shadow: 0 2px 8px rgba(0,164,153,0.10);
            --red: #e74c3c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .header { background: var(--teal); color: white; padding: 8px 16px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 200; min-height: 37px; }
        .header-title { font-size: 16px; font-weight: 700; }
        .header-back { position: absolute; left: 12px; background: none; border: none; color: white; font-size: 22px; cursor: pointer; display: none; line-height: 1; }

        .search-wrap { position: sticky; top: 37px; z-index: 190; background: var(--white); padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
        .search-wrap input { flex: 1; padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 14px; background: var(--bg); outline: none; }
        .search-wrap input:focus { border-color: var(--teal); }
        .search-wrap button { padding: 9px 16px; background: var(--teal); color: white; border: none; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }

        .content { padding-bottom: 70px; }
        .section-title { padding: 14px 14px 8px; font-size: 14px; font-weight: 700; color: var(--teal-dark); text-transform: uppercase; letter-spacing: 0.5px; }

        .breadcrumb { padding: 8px 14px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .breadcrumb span { cursor: pointer; color: var(--teal); }
        .breadcrumb .sep { color: var(--border); }
        .breadcrumb .current { color: var(--text-muted); cursor: default; }

        /* CATEGORIES */
        .categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 14px 14px; }
        .category-card { background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.15s; border: 1.5px solid var(--border); display: flex; flex-direction: column; }
        .category-card:active { transform: scale(0.96); }
        .category-img-wrap { width: 100%; aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .category-img { width: 100%; height: 100%; object-fit: cover; }
        .category-img-placeholder { font-size: 28px; }
        .category-label { padding: 6px 6px 8px; text-align: center; }
        .category-label .name { font-size: 10px; font-weight: 600; color: var(--teal-dark); line-height: 1.3; }
        .category-label .arrow { font-size: 9px; color: var(--text-muted); margin-top: 2px; }

        /* PRODUCTS GRID */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 14px; }
        .product-tile { background: var(--white); border-radius: 14px; box-shadow: var(--shadow); border: 1.5px solid var(--border); overflow: hidden; cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; }
        .product-tile:active { transform: scale(0.97); }
        .tile-img-wrap { width: 100%; aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .tile-img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
        .tile-img-placeholder { font-size: 48px; }
        .tile-actions { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 4px; }
        .tile-btn { width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.15); background: white; transition: transform 0.1s; }
        .tile-btn:active { transform: scale(0.9); }
        .tile-fav { color: #ddd; }
        .tile-fav.active { color: var(--red); }
        .tile-body { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .tile-name { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .tile-sku { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
        .tile-presence { font-size: 10px; font-weight: 500; margin-top: 3px; }
        .presence-available { color: var(--green); }
        .presence-unavailable { color: var(--red); }
        .tile-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .tile-price { font-size: 14px; font-weight: 800; color: var(--teal); }
        .tile-price span { font-size: 10px; font-weight: 500; }
        .tile-add { width: 28px; height: 28px; background: var(--teal); color: white; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; flex-shrink: 0; }

        /* DETAIL */
        #page-detail { display: none; padding-bottom: 100px; }
        .detail-img-wrap { background: var(--white); padding: 20px; text-align: center; border-bottom: 1px solid var(--border); min-height: 200px; display: flex; align-items: center; justify-content: center; }
        .detail-img { max-width: 100%; max-height: 240px; object-fit: contain; border-radius: 12px; }
        .detail-img-placeholder { font-size: 80px; }
        .detail-body { padding: 16px; }
        .detail-name { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.4; }
        .detail-sku { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .detail-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
        .detail-price { font-size: 28px; font-weight: 800; color: var(--teal); }
        .detail-price span { font-size: 16px; font-weight: 500; }
        .detail-presence-badge { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 20px; }
        .detail-presence-badge.available { background: var(--green-light); color: var(--green); }
        .detail-presence-badge.unavailable { background: #fdecea; color: var(--red); }
        .detail-desc-title { font-size: 14px; font-weight: 700; color: var(--teal-dark); margin-top: 18px; margin-bottom: 8px; }
        .detail-desc { font-size: 13px; color: #555; line-height: 1.6; }
        .detail-desc * { max-width: 100%; }
        .detail-actions { position: fixed; bottom: 60px; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
        .btn-fav-detail { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--border); background: var(--white); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; color: #ddd; }
        .btn-fav-detail.active { border-color: var(--red); background: #fff0f0; color: var(--red); }
        .btn-cart-detail { flex: 1; padding: 14px; background: var(--teal); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }

        /* CART PAGE */
        #page-cart { display: none; padding-bottom: 70px; }
        .cart-items { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
        .cart-item { background: var(--white); border-radius: 12px; padding: 12px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow); border: 1.5px solid var(--border); }
        .cart-item-img { width: 60px; height: 60px; object-fit: contain; border-radius: 8px; background: var(--bg); flex-shrink: 0; }
        .cart-item-img-placeholder { width: 60px; height: 60px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name { font-size: 12px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .cart-item-price { font-size: 13px; font-weight: 700; color: var(--teal); margin-top: 4px; }
        .cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .qty-control { display: flex; align-items: center; gap: 6px; }
        .qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--teal); background: white; color: var(--teal); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .qty-num { font-size: 14px; font-weight: 700; min-width: 20px; text-align: center; }
        .cart-item-remove { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; }
        .cart-total { padding: 14px 14px 0; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); margin: 0 14px; }
        .cart-total-label { font-size: 15px; font-weight: 600; }
        .cart-total-price { font-size: 22px; font-weight: 800; color: var(--teal); }

        /* ORDER FORM */
        .order-form { padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }
        .form-title { font-size: 15px; font-weight: 700; color: var(--teal-dark); }
        .form-input { padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; background: var(--white); outline: none; width: 100%; }
        .form-input:focus { border-color: var(--teal); }
        .form-input.error { border-color: var(--red); }
        .form-error { font-size: 11px; color: var(--red); margin-top: -6px; display: none; }
        .form-error.show { display: block; }
        .btn-order-submit { padding: 15px; background: var(--teal); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 6px; }
        .btn-order-submit:disabled { background: #ccc; cursor: default; }

        /* FAVORITES PAGE */
        #page-favorites { display: none; padding-bottom: 70px; }

        .state-box { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .state-box .icon { font-size: 40px; margin-bottom: 12px; }
        .state-box p { font-size: 14px; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .pagination { display: flex; justify-content: center; gap: 8px; padding: 16px; }
        .pagination button { padding: 8px 18px; border: 1.5px solid var(--teal); border-radius: 20px; background: white; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--teal); }
        .pagination button:disabled { color: var(--border); border-color: var(--border); cursor: default; }
        #pageInfo { align-self: center; font-size: 13px; color: var(--text-muted); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--border); display: flex; padding: 6px 0 4px; z-index: 150; }
        .nav-item { flex: 1; text-align: center; padding: 4px; cursor: pointer; color: var(--text-muted); font-size: 10px; font-weight: 500; position: relative; }
        .nav-item.active { color: var(--teal); }
        .nav-item .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-badge { position: absolute; top: 0; right: calc(50% - 18px); background: var(--red); color: white; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 10px; min-width: 16px; text-align: center; display: none; }
        .nav-badge.show { display: block; }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1A1A1A; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; white-space: nowrap; pointer-events: none; }
        .toast.show { opacity: 1; }

        /* SUCCESS */
        .success-box { text-align: center; padding: 40px 20px; }
        .success-box .icon { font-size: 60px; margin-bottom: 16px; }
        .success-box h2 { font-size: 20px; font-weight: 700; color: var(--teal); margin-bottom: 8px; }
        .success-box p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
        .btn-back-catalog { margin-top: 24px; padding: 14px 28px; background: var(--teal); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <button class="header-back" id="btnBack" onclick="goBack()">←</button>
        <div class="header-title" id="headerTitle">🦷 IRadius Dental Shop</div>
    </div>

    <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 Пошук товарів...">
        <button onclick="doSearch()">Знайти</button>
    </div>

    <!-- CATALOG -->
    <div class="content" id="page-main">
        <div id="breadcrumb-wrap"></div>
        <div class="section-title" id="catalog-title">Категорії</div>
        <div class="categories-grid" id="categories-grid">
            <div style="grid-column:1/-1" class="state-box"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- PRODUCTS -->
    <div id="page-products" style="display:none; padding-bottom:70px;">
        <div id="products-container"></div>
        <div class="pagination" id="pagination" style="display:none;">
            <button id="btnPrev" disabled>← Назад</button>
            <span id="pageInfo"></span>
            <button id="btnNext">Далі →</button>
        </div>
    </div>

    <!-- DETAIL -->
    <div id="page-detail">
        <div id="detail-img-wrap" class="detail-img-wrap"><div class="spinner"></div></div>
        <div class="detail-body">
            <div class="detail-name" id="detail-name"></div>
            <div class="detail-sku" id="detail-sku"></div>
            <div class="detail-price-row">
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-presence-badge" id="detail-presence"></div>
            </div>
            <div class="detail-desc-title" id="detail-desc-title" style="display:none;">Опис</div>
            <div class="detail-desc" id="detail-desc"></div>
        </div>
        <div class="detail-actions">
            <button class="btn-fav-detail" id="btnFavDetail" onclick="toggleFavorite()">♡</button>
            <button class="btn-cart-detail" onclick="addToCart()">🛒 Додати в кошик</button>
        </div>
    </div>

    <!-- FAVORITES -->
    <div id="page-favorites">
        <div id="favorites-container"></div>
    </div>

    <!-- CART -->
    <div id="page-cart">
        <div id="cart-items-wrap"></div>
        <div id="order-form-wrap"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-catalog" onclick="goHome()"><span class="nav-icon">🏠</span>Каталог</div>
        <div class="nav-item" id="nav-fav" onclick="showFavorites()"><span class="nav-icon">♡</span>Обране<span class="nav-badge" id="badge-fav"></span></div>
        <div class="nav-item" id="nav-cart" onclick="showCart()"><span class="nav-icon">🛒</span>Кошик<span class="nav-badge" id="badge-cart"></span></div>
        <div class="nav-item" id="nav-profile"><span class="nav-icon">👤</span>Кабінет</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const SERVER_URL = "https://thumb-scrubbed-unsent.ngrok-free.dev";
        const LIMIT = 20;
        const H = { "ngrok-skip-browser-warning": "1" };

        let currentPage = 1;
        let currentGroupId = null;
        let isSearchMode = false;
        let lastSearchQuery = '';
        let currentProductId = null;
        let currentProductData = null;
        let allGroups = [];
        let groupStack = [];

        // Persistent storage
        let favorites = JSON.parse(localStorage.getItem('ir_favorites') || '[]');
        let cart = JSON.parse(localStorage.getItem('ir_cart') || '[]');
        // cart item: {id, name, price, qty}

        // --- IMAGE BLOB ---
        async function loadImageBlob(rawUrl) {
            try {
                const res = await fetch(SERVER_URL + '/image?url=' + encodeURIComponent(rawUrl), { headers: H });
                const blob = await res.blob();
                return URL.createObjectURL(blob);
            } catch { return null; }
        }

        // --- PAGES ---
        const pages = ['page-main','page-products','page-detail','page-favorites','page-cart'];
        function showPage(name) {
            pages.forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById('page-' + name).style.display = 'block';
        }

        function setNav(active) {
            ['nav-catalog','nav-fav','nav-cart','nav-profile'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById(active).classList.add('active');
        }

        function updateBadges() {
            const favBadge = document.getElementById('badge-fav');
            const cartBadge = document.getElementById('badge-cart');
            if (favorites.length > 0) { favBadge.textContent = favorites.length; favBadge.classList.add('show'); }
            else favBadge.classList.remove('show');
            const cartCount = cart.reduce((s, i) => s + i.qty, 0);
            if (cartCount > 0) { cartBadge.textContent = cartCount; cartBadge.classList.add('show'); }
            else cartBadge.classList.remove('show');
        }

        // --- NAV ---
        function goHome() {
            showPage('main');
            document.getElementById('btnBack').style.display = 'none';
            document.getElementById('headerTitle').textContent = '🦷 IRadius Dental Shop';
            document.getElementById('catalog-title').textContent = 'Категорії';
            isSearchMode = false;
            groupStack = [];
            currentGroupId = null;
            renderGroups(getRootGroups());
            renderBreadcrumb();
            setNav('nav-catalog');
        }

        function goBack() {
            if (document.getElementById('page-detail').style.display !== 'none') {
                if (isSearchMode) {
                    showPage('products');
                } else if (currentGroupId) {
                    showPage('products');
                } else {
                    goHome();
                }
                document.getElementById('headerTitle').textContent = lastSearchQuery || (groupStack.length > 0 ? groupStack[groupStack.length-1].name : '🦷 IRadius Dental Shop');
            } else if (document.getElementById('page-products').style.display !== 'none') {
                if (groupStack.length > 0) {
                    groupStack.pop();
                    const parentId = groupStack.length > 0 ? groupStack[groupStack.length-1].id : null;
                    currentGroupId = parentId;
                    showPage('main');
                    renderGroups(parentId ? getChildGroups(parentId) : getRootGroups());
                    renderBreadcrumb();
                    document.getElementById('catalog-title').textContent = groupStack.length > 0 ? groupStack[groupStack.length-1].name : 'Категорії';
                    if (groupStack.length === 0) document.getElementById('btnBack').style.display = 'none';
                } else {
                    goHome();
                }
            } else if (document.getElementById('page-favorites').style.display !== 'none' ||
                       document.getElementById('page-cart').style.display !== 'none') {
                goHome();
            } else {
                goHome();
            }
        }

        // --- GROUPS ---
        function getRootGroups() {
            const allIds = new Set(allGroups.map(g => g.id));
            const roots = allGroups.filter(g => !g.parent_group_id || !allIds.has(g.parent_group_id));
            if (roots.length === 1) return getChildGroups(roots[0].id);
            return roots;
        }

        function getChildGroups(parentId) {
            return allGroups.filter(g => g.parent_group_id === parentId);
        }

        function renderBreadcrumb() {
            const wrap = document.getElementById('breadcrumb-wrap');
            if (groupStack.length === 0) { wrap.innerHTML = ''; return; }
            let html = '<div class="breadcrumb"><span onclick="goHome()">🏠</span>';
            groupStack.forEach((g, i) => {
                html += '<span class="sep">›</span>';
                if (i < groupStack.length - 1) html += '<span onclick="navToStack(' + i + ')">' + g.name + '</span>';
                else html += '<span class="current">' + g.name + '</span>';
            });
            html += '</div>';
            wrap.innerHTML = html;
        }

        function navToStack(idx) {
            groupStack = groupStack.slice(0, idx + 1);
            const g = groupStack[idx];
            currentGroupId = g.id;
            showPage('main');
            renderGroups(getChildGroups(g.id));
            renderBreadcrumb();
            document.getElementById('catalog-title').textContent = g.name;
        }

        function renderGroups(groups) {
            const grid = document.getElementById('categories-grid');
            if (!groups.length) { grid.innerHTML = '<div style="grid-column:1/-1" class="state-box"><p>Підкатегорій немає</p></div>'; return; }
            let html = '';
            for (const g of groups) {
                const name = (g.name_multilang && g.name_multilang.uk) || g.name || '—';
                const hasChildren = allGroups.some(c => c.parent_group_id === g.id);
                const imgUrl = g.image ? SERVER_URL + '/image?url=' + encodeURIComponent(g.image) : '';
                html += '<div class="category-card" onclick="openGroup(' + g.id + ', \'' + name.replace(/'/g, "\\'") + '\', ' + hasChildren + ')" id="cat-' + g.id + '">';
                html += '<div class="category-img-wrap">';
                if (imgUrl) html += '<img class="category-img" src="' + imgUrl + '" onerror="this.style.display=\'none\'">';
                else html += '<div class="category-img-placeholder">📦</div>';
                html += '</div>';
                html += '<div class="category-label"><div class="name">' + name + '</div>';
                if (hasChildren) html += '<div class="arrow">▶ підкатегорії</div>';
                html += '</div></div>';
            }
            if (currentGroupId) {
                html += '<div class="category-card" onclick="loadGroupProducts(' + currentGroupId + ')">';
                html += '<div class="category-img-wrap"><div class="category-img-placeholder">📋</div></div>';
                html += '<div class="category-label"><div class="name">Всі товари</div></div></div>';
            }
            grid.innerHTML = html;
        }

        function openGroup(id, name, hasChildren) {
            currentGroupId = id;
            groupStack.push({ id, name });
            renderBreadcrumb();
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('catalog-title').textContent = name;
            if (hasChildren) {
                showPage('main');
                renderGroups(getChildGroups(id));
            } else {
                loadGroupProducts(id);
            }
        }

        function loadGroupProducts(groupId) {
            currentGroupId = groupId;
            isSearchMode = false;
            showPage('products');
            document.getElementById('btnBack').style.display = 'block';
            const groupName = groupStack.length > 0 ? groupStack[groupStack.length-1].name : 'Товари';
            document.getElementById('headerTitle').textContent = groupName;
            setNav('nav-catalog');
            loadProducts(1, groupId);
        }

        async function loadGroupsFromServer() {
            try {
                const res = await fetch(SERVER_URL + '/groups', { headers: H });
                const data = await res.json();
                allGroups = data.groups || [];
                renderGroups(getRootGroups());
            } catch {
                document.getElementById('categories-grid').innerHTML =
                    '<div style="grid-column:1/-1" class="state-box"><div class="icon">⚠️</div><p>Помилка завантаження</p></div>';
            }
        }

        // --- SEARCH ---
        function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            isSearchMode = true;
            lastSearchQuery = q;
            showPage('products');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = 'Пошук: ' + q;
            setNav('nav-catalog');
            hidePagination();
            searchProducts(q);
        }

        document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

        // --- LOAD PRODUCTS ---
        async function loadProducts(page, groupId) {
            currentPage = page;
            showLoading();
            try {
                let url = SERVER_URL + '/products?limit=' + LIMIT + '&page=' + page;
                if (groupId) url += '&group_id=' + groupId;
                const res = await fetch(url, { headers: H });
                const data = await res.json();
                await renderProducts(data.products || [], 'products-container');
                updatePagination(data.products ? data.products.length : 0, groupId);
            } catch { showError("Не вдалося завантажити товари."); }
        }

        async function searchProducts(q) {
            showLoading();
            hidePagination();
            try {
                const res = await fetch(SERVER_URL + '/products/search?q=' + encodeURIComponent(q) + '&limit=50', { headers: H });
                const data = await res.json();
                const products = data.products || [];
                await renderProducts(products, 'products-container');
                if (!products.length) showEmpty('Нічого не знайдено за запитом «' + q + '»');
            } catch { showError("Помилка пошуку."); }
        }

        // --- RENDER TILES ---
        async function renderProducts(products, containerId) {
            const container = document.getElementById(containerId);
            if (!products.length) { container.innerHTML = '<div class="state-box"><div class="icon">🔍</div><p>Товарів не знайдено</p></div>'; return; }
            let html = '<div class="products-grid">';
            for (const p of products) {
                const price = p.price ? Math.round(parseFloat(p.price)) : null;
                const isFav = favorites.includes(p.id);
                const inCart = cart.find(i => i.id === p.id);
                const presence = p.presence === 'available'
                    ? '<span class="presence-available">✅ В наявності</span>'
                    : '<span class="presence-unavailable">❌ Немає</span>';
                html += '<div class="product-tile" onclick="openDetail(' + p.id + ')">';
                html += '<div class="tile-img-wrap">';
                html += '<div class="tile-img-placeholder" id="img-' + p.id + '">🦷</div>';
                html += '<div class="tile-actions">';
                html += '<button class="tile-btn tile-fav ' + (isFav ? 'active' : '') + '" id="fav-' + p.id + '" onclick="event.stopPropagation();toggleFavTile(' + p.id + ')">' + (isFav ? '❤️' : '🤍') + '</button>';
                html += '</div></div>';
                html += '<div class="tile-body">';
                html += '<div class="tile-name">' + (p.name || '—') + '</div>';
                if (p.sku) html += '<div class="tile-sku">Арт: ' + p.sku + '</div>';
                html += '<div class="tile-presence">' + presence + '</div>';
                html += '<div class="tile-bottom">';
                html += '<div class="tile-price">' + (price ? price + ' <span>грн</span>' : '—') + '</div>';
                html += '<button class="tile-add" onclick="event.stopPropagation();quickAddToCart(' + p.id + ', \'' + (p.name||'').replace(/'/g,"\\'") + '\', ' + (price||0) + ')">' + (inCart ? '✓' : '+') + '</button>';
                html += '</div></div></div>';
            }
            html += '</div>';
            container.innerHTML = html;

            for (const p of products) {
                const rawImg = p.main_image || (p.images && p.images[0] && p.images[0].url) || '';
                if (!rawImg) continue;
                const blobUrl = await loadImageBlob(rawImg);
                if (!blobUrl) continue;
                const el = document.getElementById('img-' + p.id);
                if (el) el.outerHTML = '<img class="tile-img" id="img-' + p.id + '" src="' + blobUrl + '">';
            }
        }

        // --- QUICK ADD TO CART ---
        function quickAddToCart(id, name, price) {
            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id, name, price, qty: 1 });
            }
            saveCart();
            updateBadges();
            showToast('Додано в кошик 🛒');
            const btn = document.querySelector('[onclick*="quickAddToCart(' + id + ',"]');
            if (btn) btn.textContent = '✓';
        }

        // --- DETAIL ---
        async function openDetail(id) {
            currentProductId = id;
            showPage('detail');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = 'Картка товару';
            document.getElementById('detail-img-wrap').innerHTML = '<div class="spinner"></div>';
            document.getElementById('detail-name').textContent = '';
            document.getElementById('detail-price').textContent = '';
            document.getElementById('detail-desc').textContent = '';

            try {
                const res = await fetch(SERVER_URL + '/products/' + id, { headers: H });
                const data = await res.json();
                const p = data.product;
                currentProductData = p;
                if (!p) { document.getElementById('detail-name').textContent = 'Товар не знайдено'; return; }

                const rawImg = p.main_image || (p.images && p.images[0] && p.images[0].url) || '';
                if (rawImg) {
                    const blobUrl = await loadImageBlob(rawImg);
                    document.getElementById('detail-img-wrap').innerHTML = blobUrl
                        ? '<img class="detail-img" src="' + blobUrl + '">'
                        : '<div class="detail-img-placeholder">🦷</div>';
                } else {
                    document.getElementById('detail-img-wrap').innerHTML = '<div class="detail-img-placeholder">🦷</div>';
                }

                document.getElementById('detail-name').textContent = p.name || '—';
                document.getElementById('detail-sku').textContent = p.sku ? 'Артикул: ' + p.sku : '';
                document.getElementById('detail-price').innerHTML = p.price ? Math.round(parseFloat(p.price)) + ' <span>грн</span>' : '—';

                const presEl = document.getElementById('detail-presence');
                presEl.textContent = p.presence === 'available' ? '✅ В наявності' : '❌ Немає';
                presEl.className = 'detail-presence-badge ' + (p.presence === 'available' ? 'available' : 'unavailable');

                const desc = p.description || '';
                if (desc) { document.getElementById('detail-desc-title').style.display = 'block'; document.getElementById('detail-desc').innerHTML = desc; }
                else document.getElementById('detail-desc-title').style.display = 'none';

                updateFavDetailBtn();
            } catch { document.getElementById('detail-name').textContent = 'Помилка завантаження'; }
        }

        // --- FAVORITES ---
        function toggleFavTile(id) {
            const idx = favorites.indexOf(id);
            const btn = document.getElementById('fav-' + id);
            if (idx === -1) {
                favorites.push(id);
                if (btn) { btn.textContent = '❤️'; btn.classList.add('active'); }
                showToast('Додано в обране ❤️');
            } else {
                favorites.splice(idx, 1);
                if (btn) { btn.textContent = '🤍'; btn.classList.remove('active'); }
                showToast('Видалено з обраного');
            }
            localStorage.setItem('ir_favorites', JSON.stringify(favorites));
            updateBadges();
        }

        function toggleFavorite() {
            toggleFavTile(currentProductId);
            updateFavDetailBtn();
        }

        function updateFavDetailBtn() {
            const btn = document.getElementById('btnFavDetail');
            const isFav = favorites.includes(currentProductId);
            btn.textContent = isFav ? '❤️' : '♡';
            btn.classList.toggle('active', isFav);
        }

        function addToCart() {
            if (!currentProductData) return;
            const p = currentProductData;
            quickAddToCart(p.id, p.name, p.price ? Math.round(parseFloat(p.price)) : 0);
        }

        async function showFavorites() {
            setNav('nav-fav');
            showPage('favorites');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = '❤️ Обране';
            const container = document.getElementById('favorites-container');
            if (!favorites.length) { container.innerHTML = '<div class="state-box"><div class="icon">♡</div><p>Ви ще нічого не додали в обране</p></div>'; return; }
            container.innerHTML = '<div class="state-box"><div class="spinner"></div></div>';
            const products = await Promise.all(favorites.map(id =>
                fetch(SERVER_URL + '/products/' + id, { headers: H }).then(r => r.json()).then(d => d.product).catch(() => null)
            ));
            await renderProducts(products.filter(Boolean), 'favorites-container');
        }

        // --- CART ---
        function saveCart() {
            localStorage.setItem('ir_cart', JSON.stringify(cart));
        }

        function showCart() {
            setNav('nav-cart');
            showPage('cart');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = '🛒 Кошик';
            renderCart();
        }

        function renderCart() {
            const wrap = document.getElementById('cart-items-wrap');
            const formWrap = document.getElementById('order-form-wrap');

            if (!cart.length) {
                wrap.innerHTML = '<div class="state-box"><div class="icon">🛒</div><p>Кошик порожній</p></div>';
                formWrap.innerHTML = '';
                return;
            }

            let total = 0;
            let html = '<div class="cart-items">';
            for (const item of cart) {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                html += '<div class="cart-item">';
                html += '<div class="cart-item-img-placeholder">🦷</div>';
                html += '<div class="cart-item-info">';
                html += '<div class="cart-item-name">' + item.name + '</div>';
                html += '<div class="cart-item-price">' + (item.price ? item.price * item.qty + ' грн' : '—') + '</div>';
                html += '</div>';
                html += '<div class="cart-item-right">';
                html += '<div class="qty-control">';
                html += '<button class="qty-btn" onclick="changeQty(' + item.id + ', -1)">−</button>';
                html += '<span class="qty-num">' + item.qty + '</span>';
                html += '<button class="qty-btn" onclick="changeQty(' + item.id + ', 1)">+</button>';
                html += '</div>';
                html += '<button class="cart-item-remove" onclick="removeFromCart(' + item.id + ')">🗑</button>';
                html += '</div></div>';
            }
            html += '</div>';
            html += '<div class="cart-total"><span class="cart-total-label">Разом:</span><span class="cart-total-price">' + total + ' грн</span></div>';
            wrap.innerHTML = html;

            // Форма замовлення
            const savedData = JSON.parse(localStorage.getItem('ir_order_data') || '{}');
            formWrap.innerHTML = `
                <div class="order-form">
                    <div class="form-title">📦 Оформлення замовлення</div>
                    <input class="form-input" id="f-name" placeholder="Імʼя *" value="${savedData.name || ''}" oninput="validateName(this)">
                    <div class="form-error" id="e-name">Тільки українські літери</div>
                    <input class="form-input" id="f-surname" placeholder="Прізвище *" value="${savedData.surname || ''}" oninput="validateName(this, 'e-surname')">
                    <div class="form-error" id="e-surname">Тільки українські літери</div>
                    <input class="form-input" id="f-phone" placeholder="Телефон +380... *" value="${savedData.phone || ''}" oninput="validatePhone(this)">
                    <div class="form-error" id="e-phone">Невірний формат. Приклад: +380671234567</div>
                    <input class="form-input" id="f-city" placeholder="Місто *" value="${savedData.city || ''}">
                    <input class="form-input" id="f-np" placeholder="Відділення Нової Пошти *" value="${savedData.np || ''}">
                    <input class="form-input" id="f-comment" placeholder="Коментар до замовлення" value="${savedData.comment || ''}">
                    <button class="btn-order-submit" onclick="submitOrder()">✅ Оформити замовлення</button>
                </div>`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) { cart = cart.filter(i => i.id !== id); }
            saveCart();
            updateBadges();
            renderCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
            updateBadges();
            renderCart();
        }

        // --- VALIDATION ---
        function validateName(el, errId) {
            const eId = errId || 'e-name';
            const ok = /^[А-ЯҐЄІЇа-яґєії'\- ]*$/.test(el.value);
            el.classList.toggle('error', !ok && el.value.length > 0);
            document.getElementById(eId).classList.toggle('show', !ok && el.value.length > 0);
        }

        function validatePhone(el) {
            const ok = /^\+380\d{9}$/.test(el.value.replace(/\s/g, ''));
            el.classList.toggle('error', !ok && el.value.length > 0);
            document.getElementById('e-phone').classList.toggle('show', !ok && el.value.length > 0);
        }

        // --- SUBMIT ORDER ---
        async function submitOrder() {
            const name = document.getElementById('f-name').value.trim();
            const surname = document.getElementById('f-surname').value.trim();
            const phone = document.getElementById('f-phone').value.trim().replace(/\s/g, '');
            const city = document.getElementById('f-city').value.trim();
            const np = document.getElementById('f-np').value.trim();
            const comment = document.getElementById('f-comment').value.trim();

            // Валідація
            let hasError = false;
            if (!name || !/^[А-ЯҐЄІЇа-яґєії'\- ]+$/.test(name)) {
                document.getElementById('f-name').classList.add('error');
                document.getElementById('e-name').classList.add('show');
                hasError = true;
            }
            if (!surname || !/^[А-ЯҐЄІЇа-яґєії'\- ]+$/.test(surname)) {
                document.getElementById('f-surname').classList.add('error');
                document.getElementById('e-surname').classList.add('show');
                hasError = true;
            }
            if (!phone || !/^\+380\d{9}$/.test(phone)) {
                document.getElementById('f-phone').classList.add('error');
                document.getElementById('e-phone').classList.add('show');
                hasError = true;
            }
            if (!city) { document.getElementById('f-city').classList.add('error'); hasError = true; }
            if (!np) { document.getElementById('f-np').classList.add('error'); hasError = true; }
            if (hasError) { showToast('Заповніть всі поля правильно'); return; }

            // Зберігаємо дані клієнта
            localStorage.setItem('ir_order_data', JSON.stringify({ name, surname, phone, city, np, comment }));

            const btn = document.querySelector('.btn-order-submit');
            btn.disabled = true;
            btn.textContent = 'Відправляємо...';

            const orderData = {
                name, surname, phone, city, np, comment,
                items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
                total: cart.reduce((s, i) => s + i.price * i.qty, 0)
            };

            try {
                const res = await fetch(SERVER_URL + '/order', {
                    method: 'POST',
                    headers: { ...H, 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                const data = await res.json();
                if (data.success) {
                    cart = [];
                    saveCart();
                    updateBadges();
                    document.getElementById('cart-items-wrap').innerHTML = `
                        <div class="success-box">
                            <div class="icon">✅</div>
                            <h2>Замовлення прийнято!</h2>
                            <p>Ми звʼяжемось з вами найближчим часом.<br>Дякуємо за покупку!</p>
                            <button class="btn-back-catalog" onclick="goHome()">До каталогу</button>
                        </div>`;
                    document.getElementById('order-form-wrap').innerHTML = '';
                } else {
                    btn.disabled = false;
                    btn.textContent = '✅ Оформити замовлення';
                    showToast('Помилка. Спробуйте ще раз.');
                }
            } catch {
                btn.disabled = false;
                btn.textContent = '✅ Оформити замовлення';
                showToast('Помилка звʼязку. Спробуйте ще раз.');
            }
        }

        // --- PAGINATION ---
        function updatePagination(count, groupId) {
            document.getElementById('pagination').style.display = 'flex';
            document.getElementById('btnPrev').disabled = currentPage === 1;
            document.getElementById('btnNext').disabled = count < LIMIT;
            document.getElementById('pageInfo').textContent = 'Стор. ' + currentPage;
            document.getElementById('btnNext').onclick = () => { loadProducts(currentPage + 1, groupId); window.scrollTo(0,0); };
            document.getElementById('btnPrev').onclick = () => { loadProducts(currentPage - 1, groupId); window.scrollTo(0,0); };
        }
        function hidePagination() { document.getElementById('pagination').style.display = 'none'; }

        function showLoading() {
            document.getElementById('products-container').innerHTML = '<div class="state-box"><div class="spinner"></div><p>Завантаження...</p></div>';
        }
        function showEmpty(msg) {
            document.getElementById('products-container').innerHTML = '<div class="state-box"><div class="icon">🔍</div><p>' + msg + '</p></div>';
        }
        function showError(msg) {
            document.getElementById('products-container').innerHTML = '<div class="state-box"><div class="icon">⚠️</div><p>' + msg + '</p></div>';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        // --- INIT ---
        updateBadges();
        loadGroupsFromServer();
    </script>
</body>
</html>
