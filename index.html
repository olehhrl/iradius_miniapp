<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRadius Dental Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
        }
        .header {
            background: #2E86AB;
            color: white;
            padding: 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
        .search-bar {
            padding: 12px 16px;
            background: var(--tg-theme-bg-color, #f5f5f5);
            border-bottom: 1px solid #eee;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 15px;
            background: white;
            outline: none;
        }
        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
        }
        .category-card {
            background: white;
            border-radius: 12px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.15s;
            border: 1px solid #f0f0f0;
        }
        .category-card:active { transform: scale(0.97); }
        .category-card .icon { font-size: 32px; margin-bottom: 8px; }
        .category-card .name { font-size: 13px; font-weight: 600; color: #333; }
        .section-title {
            padding: 16px 16px 8px;
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            padding: 8px 0;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 6px;
            cursor: pointer;
            color: #999;
            font-size: 11px;
        }
        .nav-item.active { color: #2E86AB; }
        .nav-item .nav-icon { font-size: 22px; display: block; }
        .content { padding-bottom: 70px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦷 IRadius Dental Shop</h1>
        <p>Стоматологічні матеріали та обладнання</p>
    </div>

    <div class="content">
        <div class="search-bar">
            <input type="text" placeholder="🔍 Пошук товарів...">
        </div>

        <div class="section-title">Категорії</div>
        <div class="categories">
            <div class="category-card">
                <div class="icon">🦷</div>
                <div class="name">Композити</div>
            </div>
            <div class="category-card">
                <div class="icon">💉</div>
                <div class="name">Анестезія</div>
            </div>
            <div class="category-card">
                <div class="icon">🔬</div>
                <div class="name">Відбиткові маси</div>
            </div>
            <div class="category-card">
                <div class="icon">⚙️</div>
                <div class="name">Інструменти</div>
            </div>
            <div class="category-card">
                <div class="icon">🧴</div>
                <div class="name">Гігієна</div>
            </div>
            <div class="category-card">
                <div class="icon">📦</div>
                <div class="name">Всі товари</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            Каталог
        </div>
        <div class="nav-item">
            <span class="nav-icon">❤️</span>
            Обране
        </div>
        <div class="nav-item">
            <span class="nav-icon">🛒</span>
            Кошик
        </div>
        <div class="nav-item">
            <span class="nav-icon">👤</span>
            Кабінет
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>
</body>
</html>
