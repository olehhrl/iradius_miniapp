<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRadius Dental Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --teal: #00A499;
            --teal-dark: #007A70;
            --teal-light: #E0F5F4;
            --green: #4CAF87;
            --green-light: #E8F5EE;
            --white: #ffffff;
            --bg: #F0F9F8;
            --text: #1A1A1A;
            --text-muted: #888;
            --border: #E0EDEC;
            --shadow: 0 2px 8px rgba(0,164,153,0.10);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: var(--teal);
            color: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
        .header-back {
            position: absolute;
            left: 12px;
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: none;
            line-height: 1;
        }

        /* SEARCH — sticky під хедером */
        .search-wrap {
            position: sticky;
            top: 37px;
            z-index: 190;
            background: var(--white);
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }
        .search-wrap input {
            flex: 1;
            padding: 9px 14px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            background: var(--bg);
            outline: none;
            color: var(--text);
        }
        .search-wrap input:focus { border-color: var(--teal); }
        .search-wrap button {
            padding: 9px 16px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* CONTENT */
        .content { padding-bottom: 70px; }

        /* CATEGORIES GRID */
        .section-title {
            padding: 14px 14px 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--teal-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 14px 14px;
        }
        .category-card {
            background: var(--white);
            border-radius: 14px;
            padding: 16px 8px 12px;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: 1.5px solid var(--border);
        }
        .category-card:active { transform: scale(0.96); }
        .category-card .icon { font-size: 28px; margin-bottom: 6px; }
        .category-card .name { font-size: 11px; font-weight: 600; color: var(--teal-dark); line-height: 1.3; }

        /* PRODUCTS GRID (плитки) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px 14px;
        }
        .product-tile {
            background: var(--white);
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1.5px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
        }
        .product-tile:active { transform: scale(0.97); }
        .tile-img-wrap {
            width: 100%;
            aspect-ratio: 1;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .tile-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }
        .tile-img-placeholder { font-size: 48px; }
        .tile-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .tile-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            background: white;
            transition: transform 0.1s;
        }
        .tile-btn:active { transform: scale(0.9); }
        .tile-fav { color: #ccc; }
        .tile-fav.active { color: #e74c3c; }
        .tile-body { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .tile-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }
        .tile-sku { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
        .tile-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }
        .tile-price { font-size: 14px; font-weight: 800; color: var(--teal); }
        .tile-price span { font-size: 10px; font-weight: 500; }
        .tile-add {
            width: 28px;
            height: 28px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            flex-shrink: 0;
        }
        .tile-presence {
            font-size: 10px;
            font-weight: 500;
            margin-top: 3px;
        }
        .presence-available { color: var(--green); }
        .presence-unavailable { color: #e74c3c; }

        /* PRODUCT DETAIL */
        #page-detail { display: none; padding-bottom: 100px; }
        .detail-img-wrap {
            background: var(--white);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .detail-img { max-width: 100%; max-height: 240px; object-fit: contain; border-radius: 12px; }
        .detail-img-placeholder { font-size: 80px; }
        .detail-body { padding: 16px; }
        .detail-name { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.4; }
        .detail-sku { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .detail-price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }
        .detail-price { font-size: 28px; font-weight: 800; color: var(--teal); }
        .detail-price span { font-size: 16px; font-weight: 500; }
        .detail-presence-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .detail-presence-badge.available { background: var(--green-light); color: var(--green); }
        .detail-presence-badge.unavailable { background: #fdecea; color: #e74c3c; }
        .detail-desc-title { font-size: 14px; font-weight: 700; color: var(--teal-dark); margin-top: 18px; margin-bottom: 8px; }
        .detail-desc { font-size: 13px; color: #555; line-height: 1.6; }
        .detail-desc * { max-width: 100%; }

        /* DETAIL ACTIONS */
        .detail-actions {
            position: fixed;
            bottom: 60px;
            left: 0; right: 0;
            background: var(--white);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-fav-detail {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--white);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #ccc;
            transition: all 0.2s;
        }
        .btn-fav-detail.active { border-color: #e74c3c; color: #e74c3c; background: #fff0f0; }
        .btn-cart-detail {
            flex: 1;
            padding: 14px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        /* STATES */
        .state-box { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .state-box .icon { font-size: 40px; margin-bottom: 12px; }
        .state-box p { font-size: 14px; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* PAGINATION */
        .pagination { display: flex; justify-content: center; gap: 8px; padding: 16px; }
        .pagination button {
            padding: 8px 18px;
            border: 1.5px solid var(--teal);
            border-radius: 20px;
            background: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--teal);
        }
        .pagination button:disabled { color: var(--border); border-color: var(--border); cursor: default; }
        #pageInfo { align-self: center; font-size: 13px; color: var(--text-muted); }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--white);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 6px 0 4px;
            z-index: 150;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 4px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 500;
        }
        .nav-item.active { color: var(--teal); }
        .nav-item .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1A1A1A;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <button class="header-back" id="btnBack" onclick="goBack()">←</button>
        <div class="header-title" id="headerTitle">🦷 IRadius Dental Shop</div>
    </div>

    <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 Пошук товарів...">
        <button onclick="doSearch()">Знайти</button>
    </div>

    <!-- MAIN: CATALOG -->
    <div class="content" id="page-main">
        <div class="section-title">Категорії</div>
        <div class="categories-grid">
            <div class="category-card" onclick="searchCategory('Композит')"><div class="icon">🦷</div><div class="name">Композити</div></div>
            <div class="category-card" onclick="searchCategory('Анестезія')"><div class="icon">💉</div><div class="name">Анестезія</div></div>
            <div class="category-card" onclick="searchCategory('відбитк')"><div class="icon">🔬</div><div class="name">Відбиткові маси</div></div>
            <div class="category-card" onclick="searchCategory('інструмент')"><div class="icon">⚙️</div><div class="name">Інструменти</div></div>
            <div class="category-card" onclick="searchCategory('гігієна')"><div class="icon">🧴</div><div class="name">Гігієна</div></div>
            <div class="category-card" onclick="searchCategory('коронк')"><div class="icon">👑</div><div class="name">Коронки</div></div>
            <div class="category-card" onclick="searchCategory('рукавичк')"><div class="icon">🧤</div><div class="name">Рукавички</div></div>
            <div class="category-card" onclick="searchCategory('маск')"><div class="icon">😷</div><div class="name">Маски</div></div>
            <div class="category-card" onclick="loadAllProducts()"><div class="icon">📦</div><div class="name">Всі товари</div></div>
        </div>
    </div>

    <!-- PRODUCTS LIST -->
    <div id="page-products" style="display:none;">
        <div id="products-container">
            <div class="state-box"><div class="spinner"></div><p>Завантаження...</p></div>
        </div>
        <div class="pagination" id="pagination" style="display:none;">
            <button id="btnPrev" onclick="changePage(-1)" disabled>← Назад</button>
            <span id="pageInfo"></span>
            <button id="btnNext" onclick="changePage(1)">Далі →</button>
        </div>
    </div>

    <!-- PRODUCT DETAIL -->
    <div id="page-detail">
        <div id="detail-img-wrap" class="detail-img-wrap"><div class="spinner"></div></div>
        <div class="detail-body">
            <div class="detail-name" id="detail-name"></div>
            <div class="detail-sku" id="detail-sku"></div>
            <div class="detail-price-row">
                <div class="detail-price" id="detail-price"></div>
                <div class="detail-presence-badge" id="detail-presence"></div>
            </div>
            <div class="detail-desc-title" id="detail-desc-title" style="display:none;">Опис</div>
            <div class="detail-desc" id="detail-desc"></div>
        </div>
        <div class="detail-actions">
            <button class="btn-fav-detail" id="btnFavDetail" onclick="toggleFavorite()">♡</button>
            <button class="btn-cart-detail" onclick="addToCart()">🛒 Додати в кошик</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-catalog" onclick="goHome()"><span class="nav-icon">🏠</span>Каталог</div>
        <div class="nav-item" id="nav-fav" onclick="showFavorites()"><span class="nav-icon">♡</span>Обране</div>
        <div class="nav-item" id="nav-cart" onclick="showCart()"><span class="nav-icon">🛒</span>Кошик</div>
        <div class="nav-item" id="nav-profile"><span class="nav-icon">👤</span>Кабінет</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const SERVER_URL = "https://thumb-scrubbed-unsent.ngrok-free.dev";
        const LIMIT = 20;
        let currentPage = 1;
        let isSearchMode = false;
        let lastSearchQuery = '';
        let currentProductId = null;
        let favorites = JSON.parse(localStorage.getItem('iradius_favorites') || '[]');
        let cart = JSON.parse(localStorage.getItem('iradius_cart') || '[]');

        // --- IMAGE BLOB ---
        async function loadImageBlob(rawUrl) {
            try {
                const res = await fetch(SERVER_URL + '/image?url=' + encodeURIComponent(rawUrl), {
                    headers: { "ngrok-skip-browser-warning": "1" }
                });
                const blob = await res.blob();
                return URL.createObjectURL(blob);
            } catch { return null; }
        }

        // --- PAGES ---
        function showPage(name) {
            document.getElementById('page-main').style.display = 'none';
            document.getElementById('page-products').style.display = 'none';
            document.getElementById('page-detail').style.display = 'none';
            if (name === 'main') document.getElementById('page-main').style.display = 'block';
            if (name === 'products') document.getElementById('page-products').style.display = 'block';
            if (name === 'detail') document.getElementById('page-detail').style.display = 'block';
        }

        function setNav(active) {
            ['nav-catalog','nav-fav','nav-cart','nav-profile'].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            document.getElementById(active).classList.add('active');
        }

        function goHome() {
            showPage('main');
            document.getElementById('btnBack').style.display = 'none';
            document.getElementById('headerTitle').textContent = '🦷 IRadius Dental Shop';
            isSearchMode = false;
            setNav('nav-catalog');
        }

        function goBack() {
            if (document.getElementById('page-detail').style.display !== 'none') {
                showPage('products');
                document.getElementById('headerTitle').textContent = lastSearchQuery || 'Товари';
                document.getElementById('btnBack').style.display = 'block';
            } else {
                goHome();
            }
        }

        // --- SEARCH ---
        function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            isSearchMode = true;
            lastSearchQuery = q;
            showPage('products');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = 'Пошук: ' + q;
            setNav('nav-catalog');
            searchProducts(q);
        }

        function searchCategory(q) {
            document.getElementById('searchInput').value = '';
            isSearchMode = true;
            lastSearchQuery = q;
            showPage('products');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = q;
            setNav('nav-catalog');
            searchProducts(q);
        }

        function loadAllProducts() {
            isSearchMode = false;
            lastSearchQuery = '';
            document.getElementById('headerTitle').textContent = 'Всі товари';
            document.getElementById('btnBack').style.display = 'block';
            showPage('products');
            setNav('nav-catalog');
            loadProducts(1);
        }

        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        // --- LOAD ---
        async function loadProducts(page) {
            currentPage = page;
            showLoading();
            try {
                const res = await fetch(SERVER_URL + '/products?limit=' + LIMIT + '&page=' + page, {
                    headers: { "ngrok-skip-browser-warning": "1" }
                });
                const data = await res.json();
                await renderProducts(data.products || []);
                updatePagination(data.products ? data.products.length : 0);
            } catch { showError("Не вдалося завантажити товари."); }
        }

        async function searchProducts(q) {
            showLoading();
            hidePagination();
            try {
                const res = await fetch(SERVER_URL + '/products/search?q=' + encodeURIComponent(q) + '&limit=50', {
                    headers: { "ngrok-skip-browser-warning": "1" }
                });
                const data = await res.json();
                const products = data.products || [];
                await renderProducts(products);
                if (!products.length) showEmpty('Нічого не знайдено за запитом «' + q + '»');
            } catch { showError("Помилка пошуку."); }
        }

        // --- RENDER TILES ---
        async function renderProducts(products) {
            const container = document.getElementById('products-container');
            if (!products.length) { showEmpty("Товарів не знайдено"); return; }

            let html = '<div class="products-grid">';
            for (const p of products) {
                const price = p.price ? Math.round(parseFloat(p.price)) + ' <span>грн</span>' : '—';
                const isFav = favorites.includes(p.id);
                const presence = p.presence === 'available'
                    ? '<span class="presence-available">✅ В наявності</span>'
                    : '<span class="presence-unavailable">❌ Немає</span>';
                html += '<div class="product-tile" onclick="openDetail(' + p.id + ')">';
                html += '<div class="tile-img-wrap">';
                html += '<div class="tile-img-placeholder" id="img-' + p.id + '">🦷</div>';
                html += '<div class="tile-actions">';
                html += '<button class="tile-btn tile-fav ' + (isFav ? 'active' : '') + '" id="fav-' + p.id + '" onclick="event.stopPropagation();toggleFavTile(' + p.id + ')">' + (isFav ? '❤️' : '🤍') + '</button>';
                html += '</div>';
                html += '</div>';
                html += '<div class="tile-body">';
                html += '<div class="tile-name">' + (p.name || '—') + '</div>';
                if (p.sku) html += '<div class="tile-sku">Арт: ' + p.sku + '</div>';
                html += '<div class="tile-presence">' + presence + '</div>';
                html += '<div class="tile-bottom">';
                html += '<div class="tile-price">' + price + '</div>';
                html += '<button class="tile-add" onclick="event.stopPropagation();addToCartById(' + p.id + ')">+</button>';
                html += '</div>';
                html += '</div>';
                html += '</div>';
            }
            html += '</div>';
            container.innerHTML = html;

            // Завантажуємо фото
            for (const p of products) {
                const rawImg = p.main_image || (p.images && p.images[0] && p.images[0].url) || '';
                if (!rawImg) continue;
                const blobUrl = await loadImageBlob(rawImg);
                if (!blobUrl) continue;
                const el = document.getElementById('img-' + p.id);
                if (el) el.outerHTML = '<img class="tile-img" id="img-' + p.id + '" src="' + blobUrl + '">';
            }
        }

        // --- DETAIL ---
        async function openDetail(id) {
            currentProductId = id;
            showPage('detail');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = 'Картка товару';
            document.getElementById('detail-img-wrap').innerHTML = '<div class="spinner"></div>';
            document.getElementById('detail-name').textContent = '';
            document.getElementById('detail-price').textContent = '';
            document.getElementById('detail-desc').textContent = '';

            try {
                const res = await fetch(SERVER_URL + '/products/' + id, {
                    headers: { "ngrok-skip-browser-warning": "1" }
                });
                const data = await res.json();
                const p = data.product;
                if (!p) { document.getElementById('detail-name').textContent = 'Товар не знайдено'; return; }

                const rawImg = p.main_image || (p.images && p.images[0] && p.images[0].url) || '';
                if (rawImg) {
                    const blobUrl = await loadImageBlob(rawImg);
                    document.getElementById('detail-img-wrap').innerHTML = blobUrl
                        ? '<img class="detail-img" src="' + blobUrl + '">'
                        : '<div class="detail-img-placeholder">🦷</div>';
                } else {
                    document.getElementById('detail-img-wrap').innerHTML = '<div class="detail-img-placeholder">🦷</div>';
                }

                document.getElementById('detail-name').textContent = p.name || '—';
                document.getElementById('detail-sku').textContent = p.sku ? 'Артикул: ' + p.sku : '';
                document.getElementById('detail-price').innerHTML = p.price
                    ? Math.round(parseFloat(p.price)) + ' <span>грн</span>' : '—';

                const presEl = document.getElementById('detail-presence');
                if (p.presence === 'available') {
                    presEl.textContent = '✅ В наявності';
                    presEl.className = 'detail-presence-badge available';
                } else {
                    presEl.textContent = '❌ Немає';
                    presEl.className = 'detail-presence-badge unavailable';
                }

                const desc = p.description || '';
                if (desc) {
                    document.getElementById('detail-desc-title').style.display = 'block';
                    document.getElementById('detail-desc').innerHTML = desc;
                } else {
                    document.getElementById('detail-desc-title').style.display = 'none';
                }

                updateFavDetailBtn();
            } catch {
                document.getElementById('detail-name').textContent = 'Помилка завантаження';
            }
        }

        // --- FAVORITES ---
        function toggleFavTile(id) {
            const idx = favorites.indexOf(id);
            const btn = document.getElementById('fav-' + id);
            if (idx === -1) {
                favorites.push(id);
                if (btn) { btn.textContent = '❤️'; btn.classList.add('active'); }
                showToast('Додано в обране ❤️');
            } else {
                favorites.splice(idx, 1);
                if (btn) { btn.textContent = '🤍'; btn.classList.remove('active'); }
                showToast('Видалено з обраного');
            }
            localStorage.setItem('iradius_favorites', JSON.stringify(favorites));
        }

        function toggleFavorite() {
            toggleFavTile(currentProductId);
            updateFavDetailBtn();
        }

        function updateFavDetailBtn() {
            const btn = document.getElementById('btnFavDetail');
            const isFav = favorites.includes(currentProductId);
            btn.textContent = isFav ? '❤️' : '♡';
            btn.classList.toggle('active', isFav);
        }

        // --- CART ---
        function addToCartById(id) {
            if (!cart.includes(id)) {
                cart.push(id);
                localStorage.setItem('iradius_cart', JSON.stringify(cart));
            }
            showToast('Додано в кошик 🛒');
        }

        function addToCart() { addToCartById(currentProductId); }

        // --- FAVORITES PAGE (заглушка) ---
        function showFavorites() {
            setNav('nav-fav');
            showPage('products');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = '❤️ Обране';
            hidePagination();
            if (!favorites.length) {
                showEmpty('Ви ще нічого не додали в обране');
                return;
            }
            showLoading();
            Promise.all(favorites.map(id =>
                fetch(SERVER_URL + '/products/' + id, { headers: { "ngrok-skip-browser-warning": "1" } })
                    .then(r => r.json()).then(d => d.product).catch(() => null)
            )).then(products => renderProducts(products.filter(Boolean)));
        }

        // --- CART PAGE (заглушка) ---
        function showCart() {
            setNav('nav-cart');
            showPage('products');
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('headerTitle').textContent = '🛒 Кошик';
            hidePagination();
            if (!cart.length) {
                showEmpty('Кошик порожній');
                return;
            }
            showLoading();
            Promise.all(cart.map(id =>
                fetch(SERVER_URL + '/products/' + id, { headers: { "ngrok-skip-browser-warning": "1" } })
                    .then(r => r.json()).then(d => d.product).catch(() => null)
            )).then(products => renderProducts(products.filter(Boolean)));
        }

        // --- PAGINATION ---
        function updatePagination(count) {
            document.getElementById('pagination').style.display = 'flex';
            document.getElementById('btnPrev').disabled = currentPage === 1;
            document.getElementById('btnNext').disabled = count < LIMIT;
            document.getElementById('pageInfo').textContent = 'Стор. ' + currentPage;
        }
        function hidePagination() { document.getElementById('pagination').style.display = 'none'; }
        function changePage(dir) { loadProducts(currentPage + dir); window.scrollTo(0, 0); }

        // --- STATES ---
        function showLoading() {
            document.getElementById('products-container').innerHTML =
                '<div class="state-box"><div class="spinner"></div><p>Завантаження...</p></div>';
        }
        function showEmpty(msg) {
            document.getElementById('products-container').innerHTML =
                '<div class="state-box"><div class="icon">🔍</div><p>' + msg + '</p></div>';
        }
        function showError(msg) {
            document.getElementById('products-container').innerHTML =
                '<div class="state-box"><div class="icon">⚠️</div><p>' + msg + '</p></div>';
        }

        // --- TOAST ---
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
